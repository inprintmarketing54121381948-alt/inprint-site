<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Wireframe — Header com carrinho de orçamento</title>
<style>
body{font-family:Arial,sans-serif; color:#1F2937; max-width:900px; margin:0 auto; padding:20px;}
.header{display:flex; justify-content:space-between; align-items:center; padding:14px 12px; border-bottom:1px solid #E5E7EB;}
.logo{display:flex; align-items:center; gap:8px;}
.logo .sq{width:32px; height:32px; border-radius:8px; background:#4F9D96;}
.nav{display:flex; gap:18px; font-size:13px; color:#6B7280;}
.actions{display:flex; align-items:center; gap:12px;}
.cart{position:relative; font-size:20px;}
.badge{position:absolute; top:-6px; right:-8px; background:#D9776B; color:#4A1B0C; font-size:10px; border-radius:8px; padding:0 4px;}
.btn{background:#0F4C5C; color:#fff; border:none; font-size:13px; padding:8px 14px;}
.note{font-size:11px; color:#9CA3AF; padding:8px 12px 0;}
.card{width:200px; border:1px solid #E5E7EB; border-radius:12px; padding:10px; margin:8px 12px;}
.placeholder{border:1px dashed #D1D5DB; height:80px; display:flex; align-items:center; justify-content:center; font-size:11px; color:#9CA3AF; margin-bottom:8px;}
.addbtn{width:100%; background:#F9FAFB; border:1px solid #D1D5DB; font-size:12px; padding:6px;}
</style>
</head>
<body>
<div class="header">
<div class="logo"><div class="sq"></div><span style="font-weight:500;">In Print</span></div>
<div class="nav"><span>Categorias ▾</span><span>Ocasiões ▾</span><span>Kits especiais</span></div>
<div class="actions">
<div class="cart">🧾<span class="badge">0</span></div>
<button class="btn">Pedir consultoria</button>
</div>
</div>
<p class="note">Exemplo de card de produto no catálogo</p>
<div class="card">
<div class="placeholder">Imagem</div>
<p style="font-size:12px; margin:0 0 8px;">Squeeze inox 500ml</p>
<button class="addbtn">+ Adicionar ao orçamento</button>
</div>
</body>
</html>
