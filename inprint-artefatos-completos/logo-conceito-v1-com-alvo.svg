<text x="190" y="558" text-anchor="middle" style="font-family:'Poppins',sans-serif; font-size:11px; fill:#9CA3AF;">Wordmark manuscrita — só no logotipo</text>
<text x="470" y="525" text-anchor="middle" style="font-family:'Poppins',sans-serif; font-weight:600; font-size:32px; fill:#1F2937;">Aa Bb Cc</text>
