<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Direção de identidade visual da Inprint - conceito inicial</title>
<desc>Conceito de evolução do logo Inprint: seta modernizada como símbolo de conexão e alvo, wordmark script mantido, paleta corporativa e tipografia de apoio.</desc>
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&amp;family=Poppins:wght@400;500;600&amp;display=swap');
</style>
</defs>
<rect width="680" height="600" fill="#FDFCFB"/>
<circle cx="170" cy="150" r="8" fill="#1F2937"/>
<line x1="178" y1="150" x2="420" y2="150" stroke="#0F4C5C" stroke-width="4" stroke-linecap="round"/>
<polygon points="420,138 448,150 420,162" fill="#0F4C5C"/>
<circle cx="496" cy="150" r="34" fill="none" stroke="#D9776B" stroke-width="3"/>
<circle cx="496" cy="150" r="21" fill="none" stroke="#D9776B" stroke-width="3"/>
<circle cx="496" cy="150" r="8" fill="#D9776B"/>
<text x="340" y="245" text-anchor="middle" style="font-family:'Dancing Script',cursive; font-weight:700; font-size:60px; fill:#1F2937;">In Print</text>
<text x="340" y="278" text-anchor="middle" style="font-family:'Poppins',sans-serif; font-weight:500; font-size:13px; letter-spacing:3px; fill:#6B7280;">IMPRESSOS &amp; BRINDES PERSONALIZADOS</text>
<line x1="140" y1="315" x2="540" y2="315" stroke="#E5E7EB" stroke-width="1"/>
<g>
