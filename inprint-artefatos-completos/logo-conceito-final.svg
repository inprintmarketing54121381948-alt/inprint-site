<rect width="680" height="560" fill="#FDFCFB"/>
<text x="340" y="100" text-anchor="middle" style="font-family:'Dancing Script',cursive; font-weight:700; font-size:60px; fill:#1F2937;">In Print</text>
<circle cx="190" cy="150" r="7" fill="#1F2937"/>
<line x1="197" y1="150" x2="470" y2="150" stroke="#0F4C5C" stroke-width="4" stroke-linecap="round"/>
