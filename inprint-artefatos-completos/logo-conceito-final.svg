<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Direção de identidade visual da Inprint - versão final aprovada</title>
<desc>Logotipo com wordmark In Print acima da seta, seta simplificada sem alvo ao centro, subtítulo Impressos e Brindes Personalizados abaixo da seta, paleta corporativa.</desc>
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&amp;family=Poppins:wght@400;500;600&amp;display=swap');
</style>
